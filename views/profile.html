<style>
.profile-view {
  max-width: 650px;
  margin: 10px auto 20px auto;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.profile-banner {
  height: 90px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  position: relative;
}
.profile-content {
  padding: 0 24px 24px 24px;
  position: relative;
}
.profile-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: -45px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.profile-avatar-large {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  border: 4px solid #ffffff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: bold;
}
.profile-actions {
  display: flex;
  gap: 8px;
}
.btn-edit {
  display: inline-block;
  background-color: #2563eb;
  color: #ffffff;
  padding: 8px 16px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  box-shadow: 0 2px 4px rgba(37,99,235,0.2);
  transition: background-color 0.15s ease;
}
.btn-edit:hover {
  background-color: #1d4ed8;
  color: #ffffff;
}
.btn-message {
  display: inline-block;
  background-color: #10b981;
  color: #ffffff;
  padding: 8px 16px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  box-shadow: 0 2px 4px rgba(16,185,129,0.2);
  transition: background-color 0.15s ease;
}
.btn-message:hover {
  background-color: #059669;
  color: #ffffff;
}
.btn-follow {
  display: inline-block;
  background-color: #0284c7;
  color: #ffffff;
  padding: 8px 16px;
  border-radius: 6px;
  border: none;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 4px rgba(2,132,199,0.2);
  transition: background-color 0.15s ease;
}
.btn-follow:hover {
  background-color: #0369a1;
}
.btn-unfollow {
  display: inline-block;
  background-color: #f8fafc;
  color: #475569;
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid #cbd5e1;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-unfollow .text-following {
  display: inline;
}
.btn-unfollow .text-unfollow {
  display: none;
}
.btn-unfollow:hover {
  background-color: #fee2e2;
  color: #b91c1c;
  border-color: #fca5a5;
}
.btn-unfollow:hover .text-following {
  display: none;
}
.btn-unfollow:hover .text-unfollow {
  display: inline;
}
.profile-stats {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
  font-size: 14px;
}
.stat-link {
  color: #475569;
  text-decoration: none;
  transition: color 0.15s ease;
}
.stat-link:hover {
  color: #2563eb;
  text-decoration: underline;
}
.stat-link strong {
  color: #0f172a;
  font-size: 15px;
}
.stat-dot {
  color: #94a3b8;
}
.btn-back {
  display: inline-block;
  background-color: #f1f5f9;
  color: #475569;
  padding: 8px 14px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
  border: 1px solid #cbd5e1;
}
.btn-back:hover {
  background-color: #e2e8f0;
}
.profile-name-section h2 {
  margin: 0 0 4px 0;
  font-size: 24px;
  color: #0f172a;
}
.profile-name-section .profile-handle {
  color: #3b82f6;
  font-size: 15px;
  font-weight: 500;
}
.profile-bio-box {
  margin-top: 18px;
  padding: 14px 16px;
  background: #f8fafc;
  border-left: 4px solid #3b82f6;
  border-radius: 4px;
  color: #334155;
  font-size: 14px;
  line-height: 1.5;
}
.profile-details-grid {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  border-top: 1px solid #e2e8f0;
  padding-top: 16px;
}
.profile-detail-item {
  display: flex;
  align-items: center;
}
.detail-label {
  width: 120px;
  font-weight: bold;
  color: #64748b;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.detail-value {
  color: #0f172a;
  font-size: 14px;
}
.notice-box {
  margin: 12px 0;
  padding: 10px 14px;
  background: #ecfdf5;
  color: #065f46;
  border: 1px solid #a7f3d0;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
}
</style>

<div class="profile-view">
  <div class="profile-banner"></div>
  <div class="profile-content">
    <div class="profile-header-bar">
      <div class="profile-avatar-large">
        {avatar_initials}
      </div>
      <div class="profile-actions">
        {follow_button}
        {message_button}
        {edit_button}
        <a href="/people" class="btn-back">&larr; People</a>
      </div>
    </div>

    {notice}

    <div class="profile-name-section">
      <h2>{firstname} {lastname}</h2>
      <div class="profile-handle">@{login}</div>
      <div class="profile-stats">
        <a href="/profile/{login}/following" class="stat-link">
          <strong>{following_count}</strong> Following
        </a>
        <span class="stat-dot">&bull;</span>
        <a href="/profile/{login}/followers" class="stat-link">
          <strong>{followers_count}</strong> Followers
        </a>
      </div>
    </div>

    <div class="profile-bio-box">
      <strong>About:</strong>
      <div>{bio}</div>
    </div>

    <div class="profile-details-grid">
      <div class="profile-detail-item">
        <span class="detail-label">Username:</span>
        <span class="detail-value">{login}</span>
      </div>
      <div class="profile-detail-item">
        <span class="detail-label">Full Name:</span>
        <span class="detail-value">{firstname} {lastname}</span>
      </div>
      <div class="profile-detail-item">
        <span class="detail-label">Email:</span>
        <span class="detail-value">{email}</span>
      </div>
    </div>
  </div>
</div>
