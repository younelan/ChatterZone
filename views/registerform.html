<style>
.register-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 24px;
    max-width: 520px;
    margin: 10px auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    color: #1e293b;
}
.register-card h2 {
    margin: 0 0 6px 0;
    font-size: 22px;
    font-weight: 800;
    color: #0f172a;
}
.register-card p.subtitle {
    margin: 0 0 18px 0;
    font-size: 14px;
    color: #64748b;
}
.form-row {
    display: flex;
    gap: 12px;
}
.form-row .form-field {
    flex: 1;
}
.form-field {
    margin-bottom: 14px;
}
.form-field label {
    display: block;
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    background: transparent !important;
    padding: 0 !important;
}
.form-field input, .form-field select {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    color: #0f172a;
    background: #f8fafc;
    transition: all 0.15s ease;
}
.form-field input:focus, .form-field select:focus {
    outline: none;
    background: #ffffff;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}
.btn-register-submit {
    width: 100%;
    padding: 11px 16px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(37,99,235,0.25);
    margin-top: 6px;
    transition: background-color 0.15s ease;
}
.btn-register-submit:hover {
    background: #1d4ed8;
}
.register-footer {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #f1f5f9;
    text-align: center;
    font-size: 13px;
    color: #64748b;
}
.register-footer a {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
}
.register-footer a:hover {
    text-decoration: underline;
}
</style>

<div class="register-card">
    <h2>Create Your Account</h2>
    <p class="subtitle">Join our community and start connecting with others.</p>
    
    {error}

    <form action="/register" method="POST">
        <div class="form-row">
            <div class="form-field">
                <label for="firstname">First Name *</label>
                <input type="text" name="firstname" id="firstname" value="{firstname}" required maxlength="50" placeholder="John">
            </div>
            <div class="form-field">
                <label for="lastname">Last Name *</label>
                <input type="text" name="lastname" id="lastname" value="{lastname}" required maxlength="50" placeholder="Doe">
            </div>
        </div>

        <div class="form-field">
            <label for="login">Username *</label>
            <input type="text" name="login" id="login" value="{login}" required maxlength="50" placeholder="johndoe">
        </div>

        <div class="form-field">
            <label for="email">Email Address *</label>
            <input type="email" name="email" id="email" value="{email}" required maxlength="50" placeholder="john@example.com">
        </div>

        <div class="form-field">
            <label for="password">Password * (min 6 characters)</label>
            <input type="password" name="password" id="password" required minlength="6" maxlength="50" placeholder="••••••••">
        </div>

        <button type="submit" class="btn-register-submit">Complete Registration</button>
    </form>

    <div class="register-footer">
        Already have an account? <a href="/login">Sign In &rarr;</a>
    </div>
</div>
