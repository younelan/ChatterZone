<style>
.connections-wrapper {
  max-width: 650px;
  margin: 10px auto 20px auto;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.connections-header {
  padding: 14px 20px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.connections-header a {
  color: #2563eb;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}
.connections-header a:hover {
  text-decoration: underline;
}
.connections-tabs {
  display: flex;
  border-bottom: 1px solid #e2e8f0;
  background: #ffffff;
}
.conn-tab {
  flex: 1;
  text-align: center;
  padding: 12px 16px;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  color: #64748b;
  border-bottom: 2px solid transparent;
  transition: all 0.15s ease;
}
.conn-tab.active {
  color: #2563eb;
  border-bottom-color: #2563eb;
  background: #f8fafc;
}
.conn-tab:hover:not(.active) {
  color: #0f172a;
  background: #f8fafc;
}
.connections-list {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.connection-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  background: #ffffff;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.connection-item:hover {
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.conn-user-info {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  flex-grow: 1;
  min-width: 0;
}
.conn-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  flex-shrink: 0;
}
.conn-name-block {
  min-width: 0;
}
.conn-fullname {
  font-weight: bold;
  font-size: 14px;
  color: #0f172a;
}
.conn-username {
  font-size: 12px;
  color: #3b82f6;
}
.conn-bio-snippet {
  font-size: 12px;
  color: #64748b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.conn-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-left: 12px;
  flex-wrap: wrap;
}
.btn-conn-view {
  display: inline-block;
  background-color: #f1f5f9;
  color: #475569;
  padding: 6px 12px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid #cbd5e1;
  transition: all 0.15s ease;
}
.btn-conn-view:hover {
  background-color: #e2e8f0;
  color: #0f172a;
}
.btn-conn-msg {
  display: inline-flex;
  align-items: center;
  background-color: #10b981;
  color: #ffffff;
  padding: 6px 12px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(16,185,129,0.2);
  transition: background-color 0.15s ease;
}
.btn-conn-msg:hover {
  background-color: #059669;
  color: #ffffff;
}
.btn-conn-follow {
  display: inline-block;
  background-color: #0284c7;
  color: #ffffff;
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(2,132,199,0.2);
  transition: background-color 0.15s ease;
}
.btn-conn-follow:hover {
  background-color: #0369a1;
}
.btn-conn-unfollow {
  display: inline-block;
  background-color: #f8fafc;
  color: #475569;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid #cbd5e1;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-conn-unfollow .text-following {
  display: inline;
}
.btn-conn-unfollow .text-unfollow {
  display: none;
}
.btn-conn-unfollow:hover {
  background-color: #fee2e2;
  color: #b91c1c;
  border-color: #fca5a5;
}
.btn-conn-unfollow:hover .text-following {
  display: none;
}
.btn-conn-unfollow:hover .text-unfollow {
  display: inline;
}
.empty-connections {
  padding: 36px 16px;
  text-align: center;
  color: #94a3b8;
  font-size: 14px;
}
</style>

<div class="connections-wrapper">
  <div class="connections-header">
    <a href="{back_url}">&larr; {back_text}</a>
    <span style="font-size: 13px; color: #64748b;">@{profile_login}</span>
  </div>

  <div class="connections-tabs">
    <a href="/profile/{profile_login}/following" class="conn-tab {following_active}">
      Following ({following_count})
    </a>
    <a href="/profile/{profile_login}/followers" class="conn-tab {followers_active}">
      Followers ({followers_count})
    </a>
  </div>

  <div class="connections-list">
    {connections_list}
  </div>
</div>
