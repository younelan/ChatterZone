<style>
.profile-edit-card {
  max-width: 600px;
  margin: 10px auto 20px auto;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.profile-edit-card h2 {
  margin-top: 0;
  margin-bottom: 6px;
  color: #1e3a8a;
}
.profile-edit-subtitle {
  color: #64748b;
  font-size: 14px;
  margin-bottom: 20px;
}
.edit-form-group {
  margin-bottom: 16px;
}
.edit-form-group label {
  display: block;
  font-weight: bold;
  font-size: 13px;
  color: #334155;
  margin-bottom: 6px;
}
.edit-form-group input[type="text"],
.edit-form-group input[type="email"],
.edit-form-group textarea,
.edit-form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 14px;
  box-sizing: border-box;
  font-family: inherit;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.edit-form-group input:focus,
.edit-form-group textarea:focus,
.edit-form-group select:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
.edit-form-group input:disabled {
  background: #f1f5f9;
  color: #64748b;
  cursor: not-allowed;
}
.edit-form-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  align-items: center;
}
.btn-save {
  background-color: #2563eb;
  color: #ffffff;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 4px rgba(37,99,235,0.2);
  transition: background-color 0.15s ease;
}
.btn-save:hover {
  background-color: #1d4ed8;
}
.btn-cancel {
  background-color: #f1f5f9;
  color: #475569;
  padding: 10px 18px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
  border: 1px solid #cbd5e1;
}
.btn-cancel:hover {
  background-color: #e2e8f0;
}
.edit-error {
  margin-bottom: 16px;
  padding: 10px 14px;
  background: #fef2f2;
  color: #991b1b;
  border: 1px solid #fecaca;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
}
</style>

<div class="profile-edit-card">
  <h2>Edit Profile</h2>
  <div class="profile-edit-subtitle">Update your personal details and community bio.</div>

  {error}

  <form method="POST" action="/profile/{login}/edit">
    <div class="edit-form-group">
      <label>Username</label>
      <input type="text" value="{login}" disabled />
      <small style="color: #64748b; font-size: 12px;">Usernames cannot be changed.</small>
    </div>

    <div class="edit-form-group">
      <label for="firstname">First Name *</label>
      <input type="text" id="firstname" name="firstname" value="{firstname}" required />
    </div>

    <div class="edit-form-group">
      <label for="lastname">Last Name *</label>
      <input type="text" id="lastname" name="lastname" value="{lastname}" required />
    </div>

    <div class="edit-form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" value="{email}" required />
    </div>

    <div class="edit-form-group">
      <label for="bio">About Me / Bio</label>
      <textarea id="bio" name="bio" rows="4" placeholder="Tell the community a little about yourself...">{bio}</textarea>
    </div>

    <div class="edit-form-group">
      <label for="theme">Site Theme</label>
      <select id="theme" name="theme">
        {theme_options}
      </select>
      <small style="color: #64748b; font-size: 12px;">Choose your preferred look and feel.</small>
    </div>

    <div class="edit-form-actions">
      <button type="submit" class="btn-save">Save Changes</button>
      <a href="/profile/{login}" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
