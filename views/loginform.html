<style>
.login-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    color: #1e293b;
}
.login-card h3 {
    margin: 0 0 8px 0;
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    border-bottom: 2px solid #3b82f6;
    padding-bottom: 6px;
}
.login-card p.subtitle {
    margin: 0 0 16px 0;
    font-size: 13px;
    color: #64748b;
}
.login-field {
    margin-bottom: 14px;
}
.login-field label {
    display: block;
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    background: transparent !important;
    padding: 0 !important;
}
.login-field input {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    color: #0f172a;
    background: #f8fafc;
    transition: all 0.15s ease;
}
.login-field input:focus {
    outline: none;
    background: #ffffff;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}
.btn-login-submit {
    width: 100%;
    padding: 10px 16px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(37,99,235,0.25);
    transition: background-color 0.15s ease, transform 0.05s ease;
}
.btn-login-submit:hover {
    background: #1d4ed8;
}
.btn-login-submit:active {
    transform: translateY(1px);
}
.login-footer-link {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #f1f5f9;
    font-size: 13px;
    text-align: center;
    color: #64748b;
}
.login-footer-link a {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
}
.login-footer-link a:hover {
    text-decoration: underline;
}
</style>

<div class="login-card">
    <h3>Sign In</h3>
    <p class="subtitle">Welcome back! Please enter your details.</p>
    <form method="POST" action="/login"> 
        <div class="login-field">
            <label for="usrLogin">Username or Email</label>
            <input type="text" name="usrLogin" id="usrLogin" placeholder="Enter username or email" required autocomplete="username">
        </div>
        <div class="login-field">
            <label for="usrPassword">Password</label>
            <input type="password" name="usrPassword" id="usrPassword" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login-submit">Log In</button>
    </form> 
    <div class="login-footer-link">
        New here? <a href="/register">Create an account &rarr;</a>
    </div>
</div>
