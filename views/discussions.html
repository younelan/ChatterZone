<style>
.chat-app-wrapper {
  margin-top: 5px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  display: flex;
  height: 520px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}

/* Left Sidebar - Compact Conversations List */
.chat-sidebar {
  width: 175px;
  min-width: 160px;
  max-width: 190px;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  background: #f8fafc;
  flex-shrink: 0;
}
.chat-sidebar-header {
  padding: 10px 12px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ffffff;
}
.chat-sidebar-header h3 {
  margin: 0;
  font-size: 14px;
  font-weight: bold;
  color: #1e3a8a;
}
.btn-new-chat {
  font-size: 11px;
  color: #2563eb;
  text-decoration: none;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #bfdbfe;
  background: #eff6ff;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn-new-chat:hover {
  background: #dbeafe;
}
.chat-conv-list {
  flex-grow: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.chat-conv-item {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  text-decoration: none;
  color: inherit;
  border-left: 3px solid transparent;
  transition: background-color 0.15s ease;
  gap: 8px;
}
.chat-conv-item:hover {
  background-color: #f1f5f9;
}
.chat-conv-item.active {
  background-color: #e0f2fe;
  border-left-color: #0284c7;
}
.conv-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 12px;
  flex-shrink: 0;
}
.conv-details {
  flex-grow: 1;
  min-width: 0;
}
.conv-name {
  font-weight: 600;
  font-size: 13px;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.conv-snippet {
  font-size: 11px;
  color: #64748b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.chat-conv-item.unread .conv-snippet {
  color: #0f172a;
  font-weight: bold;
}
.conv-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.conv-time {
  font-size: 10px;
  color: #94a3b8;
  line-height: 1;
}
.conv-unread-badge {
  background-color: #2563eb;
  color: #ffffff;
  font-size: 10px;
  font-weight: bold;
  padding: 0 5px;
  border-radius: 8px;
  margin-left: 4px;
  flex-shrink: 0;
}
.no-conv-box {
  padding: 20px 10px;
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
}

/* Right Main - Spacious Chat Thread */
.chat-main {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  min-width: 0;
  width: calc(100% - 175px);
}
.chat-main-header {
  padding: 10px 14px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ffffff;
  flex-shrink: 0;
}
.chat-header-user {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.chat-header-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 13px;
  flex-shrink: 0;
}
.chat-header-info {
  min-width: 0;
}
.chat-header-info h4 {
  margin: 0;
  font-size: 14px;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-header-info a {
  font-size: 12px;
  color: #3b82f6;
  text-decoration: none;
}
.chat-header-info a:hover {
  text-decoration: underline;
}

/* Chat Stream */
.chat-stream {
  flex-grow: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #f8fafc;
}
.chat-bubble-row {
  display: flex;
  flex-direction: column;
  max-width: 78%;
}
.chat-bubble-row.outgoing {
  align-self: flex-end;
  align-items: flex-end;
}
.chat-bubble-row.incoming {
  align-self: flex-start;
  align-items: flex-start;
}
.chat-bubble {
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.4;
  word-wrap: break-word;
  white-space: pre-wrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.chat-bubble-row.outgoing .chat-bubble {
  background-color: #2563eb;
  color: #ffffff;
  border-bottom-right-radius: 2px;
}
.chat-bubble-row.incoming .chat-bubble {
  background-color: #ffffff;
  color: #1e293b;
  border: 1px solid #e2e8f0;
  border-bottom-left-radius: 2px;
}
.chat-bubble-time {
  font-size: 10px;
  color: #94a3b8;
  margin-top: 2px;
  padding: 0 2px;
}
.empty-thread {
  margin: auto;
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
  padding: 20px;
}

/* Chat Input Footer */
.chat-footer {
  padding: 10px 12px;
  border-top: 1px solid #e2e8f0;
  background: #ffffff;
  flex-shrink: 0;
}
.chat-input-form {
  display: flex;
  gap: 8px;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
}
.chat-input-box {
  flex: 1 1 auto;
  min-width: 0;
  padding: 8px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 18px;
  font-size: 13px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  box-sizing: border-box;
}
.chat-input-box:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
}
.btn-chat-send {
  flex: 0 0 auto;
  background-color: #2563eb;
  color: #ffffff;
  border: none;
  border-radius: 18px;
  padding: 8px 14px;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: background-color 0.15s ease;
  box-shadow: 0 1px 3px rgba(37,99,235,0.25);
}
.btn-chat-send:hover {
  background-color: #1d4ed8;
}

/* Placeholder when no conversation is selected */
.chat-empty-state {
  margin: auto;
  text-align: center;
  padding: 30px 16px;
  color: #64748b;
}
.chat-empty-icon {
  font-size: 36px;
  margin-bottom: 8px;
}
.chat-empty-state h3 {
  margin: 0 0 6px 0;
  color: #1e3a8a;
  font-size: 18px;
}
.chat-empty-state p {
  margin: 0 0 14px 0;
  font-size: 13px;
}
.btn-browse-people {
  display: inline-block;
  background-color: #2563eb;
  color: #ffffff;
  padding: 7px 14px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  font-size: 13px;
}
.btn-browse-people:hover {
  background-color: #1d4ed8;
}

@media (max-width: 600px) {
  .chat-app-wrapper {
    flex-direction: column;
    height: 480px;
  }
  .chat-sidebar {
    width: 100%;
    max-width: 100%;
    max-height: 140px;
    border-right: none;
    border-bottom: 1px solid #e2e8f0;
  }
  .chat-main {
    width: 100%;
  }
}
</style>

<div class="chat-app-wrapper">
  <!-- Left Column: Compact Conversations List -->
  <div class="chat-sidebar">
    <div class="chat-sidebar-header">
      <h3>Chats</h3>
      <a href="/people" class="btn-new-chat">+ New</a>
    </div>
    <div class="chat-conv-list">
      {conversation_items}
    </div>
  </div>

  <!-- Right Column: Spacious Chat Thread -->
  <div class="chat-main">
    {active_chat_content}
  </div>
</div>

<script>
  // Auto-scroll chat stream to the bottom
  const stream = document.getElementById('chat-stream');
  if (stream) {
    stream.scrollTop = stream.scrollHeight;
  }
  const input = document.getElementById('chat-input');
  if (input) {
    input.focus();
  }
</script>
